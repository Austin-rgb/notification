[package]
name = "notification"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-web = "4.13.0"
actix-web-actors = "4.3.1"
anyhow = "1.0.103"
async-trait = "0.1.89"
ferrumec = { version = "0.4.6", features = ["web","pg"] }
rand = "0.10.2"
base64 = "0.23.1"
http = "1.5.0"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "migrate", "macros"] }
tera = "1.20.1"
tokio = { version = "1.54.1", features = ["fs", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
viewset = { version = "0.6.5", features = ["web"] }
