[package]
name = "notification"
version = "0.1.0"
edition = "2024"
default-run = "notification"

# The service is a library (all logic, reusable/embeddable) plus a thin binary
# that only wires infrastructure and starts the HTTP server.
[lib]
name = "notification"
path = "src/lib.rs"

[[bin]]
name = "notification"
path = "src/main.rs"

[dependencies]
actix = "0.13.5"
actix-web = "4.13.0"
actix-web-actors = "4.3.1"
# `jwt` enables `Jwt<T>` (the auth extractor) and `HS256Signer`.
actixutils = { version = "0.6.7", features = ["jwt"] }
anyhow = "1.0.103"
async-trait = "0.1.89"
rand = "0.10.2"
# Shared cache / pending-OTP store. `connection-manager` = auto-reconnecting handle.
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
# `migrate` + `macros` are needed for `sqlx::migrate!`; rustls for managed Postgres (TLS).
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "migrate", "macros"] }
tera = "1.20.1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
typed-eventbus = "0.2.1"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
viewset = "0.4"
